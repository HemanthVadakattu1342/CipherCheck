<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Tester</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --text: #e8e8f0;
      --muted: #555570;
      --weak: #ff3b5c;
      --fair: #ffaa00;
      --good: #00d4aa;
      --strong: #7c3aed;
      --accent: #00d4aa;
    }
 
    * { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
 
    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridPulse 8s ease-in-out infinite;
      pointer-events: none;
    }
 
    @keyframes gridPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
 
    /* Glowing orb background */
    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,212,170,0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: background 0.8s ease;
    }
 
    .container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
 
    /* Header */
    .header {
      margin-bottom: 40px;
      animation: slideDown 0.6s ease both;
    }
 
    .header .tag {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
 
    .header .tag::before {
      content: '';
      display: inline-block;
      width: 20px;
      height: 1px;
      background: var(--accent);
    }
 
    h1 {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--text);
    }
 
    h1 span {
      color: var(--accent);
    }
 
    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      position: relative;
      overflow: hidden;
      animation: slideUp 0.6s ease 0.1s both;
    }
 
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }
 
    /* Input */
    .input-group {
      position: relative;
      margin-bottom: 28px;
    }
 
    .input-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: block;
    }
 
    .input-wrap {
      position: relative;
    }
 
    input {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      padding: 14px 50px 14px 18px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      letter-spacing: 2px;
    }
 
    input::placeholder {
      color: var(--muted);
      letter-spacing: 1px;
      font-size: 13px;
    }
 
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,170,0.08);
    }
 
    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
 
    .eye-btn:hover { color: var(--accent); }
 
    /* Strength meter — segmented bars */
    .meter-section { margin-bottom: 28px; }
 
    .meter-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
 
    .meter-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }
 
    .strength-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: color 0.4s;
      color: var(--muted);
    }
 
    .segments {
      display: flex;
      gap: 6px;
    }
 
    .seg {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      transition: background 0.4s ease, transform 0.3s ease;
      transform-origin: left;
    }
 
    .seg.active { transform: scaleY(1.5); }
 
    /* Score ring */
    .score-ring-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
 
    .ring-container {
      position: relative;
      width: 120px;
      height: 120px;
    }
 
    .ring-container svg {
      transform: rotate(-90deg);
    }
 
    .ring-bg { fill: none; stroke: var(--border); stroke-width: 6; }
    .ring-fg {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 314;
      stroke-dashoffset: 314;
      transition: stroke-dashoffset 0.7s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s ease;
    }
 
    .ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
 
    .ring-score {
      font-family: 'Space Mono', monospace;
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
      transition: color 0.4s;
      color: var(--muted);
    }
 
    .ring-max {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
 
    /* Checklist */
    .checks-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
    }
 
    .checks {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
 
    .check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      transition: all 0.3s ease;
      font-size: 13px;
      color: var(--muted);
    }
 
    .check-item.pass {
      border-color: rgba(0,212,170,0.25);
      background: rgba(0,212,170,0.05);
      color: var(--good);
    }
 
    .check-item.fail {
      border-color: rgba(255,59,92,0.2);
      background: rgba(255,59,92,0.04);
      color: #ff6b84;
    }
 
    .check-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
      transition: all 0.3s;
      background: var(--border);
      color: var(--muted);
    }
 
    .check-item.pass .check-icon {
      background: rgba(0,212,170,0.15);
      color: var(--good);
    }
 
    .check-item.fail .check-icon {
      background: rgba(255,59,92,0.1);
      color: var(--weak);
    }
 
    /* Idle state */
    .idle-msg {
      text-align: center;
      padding: 20px 0;
      color: var(--muted);
      font-size: 13px;
      font-family: 'Space Mono', monospace;
    }
 
    .idle-msg .cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: var(--accent);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }
 
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes slideDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
    @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }
 
    .pop { animation: pop 0.25s ease; }
  </style>
</head>
<body>
 
<div class="container">
  <div class="header">
    <div class="tag">Security Tool</div>
    <h1>Password<br><span>Strength</span></h1>
  </div>
 
  <div class="card">
 
    <!-- Input -->
    <div class="input-group">
      <label class="input-label" for="pwd">Enter password</label>
      <div class="input-wrap">
        <input type="password" id="pwd" placeholder="type something secret..." oninput="checkStrength()" autocomplete="off" spellcheck="false">
        <button class="eye-btn" onclick="toggleVisibility()" title="Show/hide">
          <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
 
    <!-- Segmented bar -->
    <div class="meter-section">
      <div class="meter-header">
        <span class="meter-label">Strength meter</span>
        <span class="strength-text" id="strength-text">—</span>
      </div>
      <div class="segments">
        <div class="seg" id="s1"></div>
        <div class="seg" id="s2"></div>
        <div class="seg" id="s3"></div>
        <div class="seg" id="s4"></div>
        <div class="seg" id="s5"></div>
        <div class="seg" id="s6"></div>
      </div>
    </div>
 
    <!-- Score ring -->
    <div class="score-ring-wrap">
      <div class="ring-container">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="50"/>
          <circle class="ring-fg" id="ring" cx="60" cy="60" r="50"/>
        </svg>
        <div class="ring-label">
          <span class="ring-score" id="ring-score">0</span>
          <span class="ring-max">/ 6</span>
        </div>
      </div>
    </div>
 
    <!-- Checklist -->
    <div id="checks-wrap">
      <div class="idle-msg">start typing to analyse<span class="cursor"></span></div>
    </div>
 
  </div>
</div>
 
<script>
  const checks = [
    { id: 'len8',    label: '8+ characters',          icon: '↔' },
    { id: 'len12',   label: '12+ characters (bonus)',  icon: '↔↔' },
    { id: 'upper',   label: 'Uppercase letter',        icon: 'A' },
    { id: 'lower',   label: 'Lowercase letter',        icon: 'a' },
    { id: 'number',  label: 'Number (0–9)',             icon: '9' },
    { id: 'symbol',  label: 'Special character',       icon: '#' },
  ];
 
  const colors = {
    weak:      { seg: '#ff3b5c', text: '#ff3b5c', ring: '#ff3b5c' },
    fair:      { seg: '#ffaa00', text: '#ffaa00', ring: '#ffaa00' },
    good:      { seg: '#00b4d8', text: '#00b4d8', ring: '#00b4d8' },
    strong:    { seg: '#00d4aa', text: '#00d4aa', ring: '#00d4aa' },
    verystrong:{ seg: '#7c3aed', text: '#a78bfa', ring: '#7c3aed' },
  };
 
  const labelMap = { 'Weak': 'weak', 'Fair': 'fair', 'Strong': 'good', 'Very Strong': 'strong' };
 
  let rendered = false;
 
  function renderChecklist() {
    if (rendered) return;
    rendered = true;
    const wrap = document.getElementById('checks-wrap');
    wrap.innerHTML = `
      <div class="checks-label">Rule checks</div>
      <div class="checks" id="checks">
        ${checks.map(c => `
          <div class="check-item" id="ci-${c.id}">
            <div class="check-icon" id="ico-${c.id}">${c.icon}</div>
            <span>${c.label}</span>
          </div>
        `).join('')}
      </div>
    `;
  }
 
  function toggleVisibility() {
    const input = document.getElementById('pwd');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      input.type = 'password';
      icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  }
 
  async function checkStrength() {
    const password = document.getElementById('pwd').value;
 
    if (!password) {
      resetUI();
      return;
    }
 
    renderChecklist();
 
    // --- Send to Flask ---
    let data;
    try {
      const response = await fetch('/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      data = await response.json();
    } catch(e) {
      // Fallback: run checks client-side if Flask isn't reachable
      data = clientCheck(password);
    }
 
    const score = data.score;
    const max   = data.max;
    const label = data.label;
    const tips  = data.tips;
 
    // Determine color theme
    let theme;
    if (score <= 2)      theme = colors.weak;
    else if (score <= 3) theme = colors.fair;
    else if (score <= 4) theme = colors.good;
    else if (score <= 5) theme = colors.strong;
    else                 theme = colors.verystrong;
 
    // Update segments
    for (let i = 1; i <= 6; i++) {
      const seg = document.getElementById('s' + i);
      if (i <= score) {
        seg.style.background = theme.seg;
        seg.classList.add('active');
      } else {
        seg.style.background = 'var(--border)';
        seg.classList.remove('active');
      }
    }
 
    // Update strength text
    const st = document.getElementById('strength-text');
    st.textContent = label;
    st.style.color = theme.text;
 
    // Update ring
    const ring = document.getElementById('ring');
    const circumference = 314;
    const offset = circumference - (score / max) * circumference;
    ring.style.strokeDashoffset = offset;
    ring.style.stroke = theme.ring;
 
    // Update ring score
    const rs = document.getElementById('ring-score');
    rs.textContent = score;
    rs.style.color = theme.text;
    rs.classList.remove('pop');
    void rs.offsetWidth;
    rs.classList.add('pop');
 
    // Update checklist
    const failSet = new Set(tips);
    checks.forEach(c => {
      const item = document.getElementById('ci-' + c.id);
      const ico  = document.getElementById('ico-' + c.id);
      if (!item) return;
 
      // Determine if this rule passed by matching tip text
      const passed = !ruleFailedFor(c.id, tips);
      item.className = 'check-item ' + (passed ? 'pass' : 'fail');
      ico.textContent = passed ? '✓' : '✗';
    });
  }
 
  function ruleFailedFor(id, tips) {
    const map = {
      len8:   '8 characters',
      len12:  null,
      upper:  'uppercase',
      lower:  'lowercase',
      number: 'numbers',
      symbol: 'special',
    };
    if (id === 'len12') return false; // bonus — always "pass" visually
    const keyword = map[id];
    if (!keyword) return false;
    return tips.some(t => t.toLowerCase().includes(keyword));
  }
 
  function clientCheck(password) {
    // Simple fallback if Flask isn't running
    let score = 0, tips = [];
    if (password.length >= 8) score++; else tips.push('Use at least 8 characters');
    if (password.length >= 12) score++;
    if (/[A-Z]/.test(password)) score++; else tips.push('Add uppercase letters (A-Z)');
    if (/[a-z]/.test(password)) score++; else tips.push('Add lowercase letters (a-z)');
    if (/[0-9]/.test(password)) score++; else tips.push('Add numbers (0-9)');
    if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) score++; else tips.push('Add special characters (!@#$...)');
    const label = score <= 2 ? 'Weak' : score <= 4 ? 'Fair' : score == 5 ? 'Strong' : 'Very Strong';
    return { score, max: 6, label, tips };
  }
 
  function resetUI() {
    rendered = false;
    for (let i = 1; i <= 6; i++) {
      const seg = document.getElementById('s' + i);
      seg.style.background = 'var(--border)';
      seg.classList.remove('active');
    }
    document.getElementById('strength-text').textContent = '—';
    document.getElementById('strength-text').style.color = 'var(--muted)';
    document.getElementById('ring').style.strokeDashoffset = 314;
    document.getElementById('ring').style.stroke = 'var(--border)';
    document.getElementById('ring-score').textContent = '0';
    document.getElementById('ring-score').style.color = 'var(--muted)';
    document.getElementById('checks-wrap').innerHTML = `<div class="idle-msg">start typing to analyse<span class="cursor"></span></div>`;
  }
</script>
</body>
</html>
